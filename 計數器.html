<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>測試計算機 (四排顯示)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 95%;
            max-width: 1400px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        label {
            display: inline-block;
            margin-right: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 15px;
            font-size: 0.9em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 2px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #test-items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .test-item {
            width: calc(25% - 10px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 5px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .test-item > span:first-child {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .timer-display {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin: 8px 0;
        }

        .result {
            font-weight: bold;
            margin-top: 5px;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
        }

        .test-count {
            margin-top: 5px;
            font-size: 0.9em;
            color: #777;
        }

        .summary {
            margin-top: 8px;
            padding: 6px;
            border-radius: 5px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .summary .pass-label {
            color: #155724;
            background-color: #d4edda;
            padding: 3px 6px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .summary .fail-label {
            color: #721c24;
            background-color: #f8d7da;
            padding: 3px 6px;
            border-radius: 5px;
        }

        .producer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>測試計算機</h1>

        <div class="input-group">
            <label for="new-test-item">新增測試項目:</label>
            <input type="text" id="new-test-item" placeholder="請輸入測試項目名稱">
            <button onclick="addTestItem()">新增</button>
        </div>

        <div id="test-items-container">
            <!-- 測試項目將會新增在此 -->
        </div>

        <div class="producer">
            <p>Producer: Ren Liao</p>
        </div>
    </div>

    <script>
        const testItemsContainer = document.getElementById('test-items-container');
        const newTestItemInput = document.getElementById('new-test-item');
        
        // 全域計時器字典，確保每個項目的計時器獨立且可被精準清除
        const activeTimers = {};
        let itemCounter = 0;

        // 使用 Web Audio API 產生提示音效（支援 GitHub Pages）
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3); 
            } catch (e) {
                console.log("音效播放失敗或瀏覽器未授權", e);
            }
        }

        function addTestItem() {
            const testItemName = newTestItemInput.value.trim();
            if (testItemName === "") {
                alert("請輸入測試項目名稱");
                return;
            }

            itemCounter++;
            const currentId = itemCounter;

            const testItemDiv = document.createElement('div');
            testItemDiv.classList.add('test-item');
            testItemDiv.dataset.itemId = currentId;
            testItemDiv.dataset.testCount = 0; 
            testItemDiv.dataset.passCount = 0; 
            testItemDiv.dataset.failCount = 0; 

            testItemDiv.innerHTML = `
                <span>${testItemName}</span>
                <div class="timer-display">00:10</div>
                <div>
                    <button onclick="startTimer(${currentId}, this.parentNode.parentNode)">開始計時</button>
                    <button onclick="logTestResult(this.parentNode.parentNode, 'Pass')">PASS</button>
                    <button onclick="logTestResult(this.parentNode.parentNode, 'Fail')">FAIL</button>
                </div>
                <span class="test-count">測試次數: 0</span>
                <div class="summary">
                    <span class="pass-label">PASS: 0</span>
                    <span class="fail-label">FAIL: 0</span>
                </div>
            `;
            testItemsContainer.appendChild(testItemDiv);
            newTestItemInput.value = ""; 
        }

        function startTimer(id, testItemDiv) {
            // 如果該項目已經有正在執行的計時器，強制清除它，避免重複點擊加速
            if (activeTimers[id]) {
                clearInterval(activeTimers[id]);
                activeTimers[id] = null;
            }

            let timeLeft = 10; // 倒數 10 秒（若需更改秒數可在此修改）
            const timerDisplay = testItemDiv.querySelector('.timer-display');
            
            updateTimerDisplay(timerDisplay, timeLeft);

            // 啟動新計時器並記錄到全域字典中
            activeTimers[id] = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timerDisplay, timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(activeTimers[id]);
                    activeTimers[id] = null;
                    playBeep(); // 播放音效
                }
            }, 1000);
        }

        function updateTimerDisplay(timerDisplay, seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function logTestResult(testItemDiv, result) {
            const resultSpan = document.createElement('span');
            resultSpan.classList.add('result', result.toLowerCase());
            resultSpan.textContent = result;

            const existingResult = testItemDiv.querySelector('.result');
            if (existingResult) {
                existingResult.remove();
            }

            testItemDiv.appendChild(resultSpan);

            // 更新測試次數
            let testCount = parseInt(testItemDiv.dataset.testCount, 10) + 1;
            testItemDiv.dataset.testCount = testCount;
            testItemDiv.querySelector('.test-count').textContent = `測試次數: ${testCount}`;

            // 更新 Pass / Fail 次數
            let passCount = parseInt(testItemDiv.dataset.passCount, 10) || 0;
            let failCount = parseInt(testItemDiv.dataset.failCount, 10) || 0;

            if (result === 'Pass') {
                passCount++;
                testItemDiv.dataset.passCount = passCount;
            } else {
                failCount++;
                testItemDiv.dataset.failCount = failCount;
            }

            updateSummary(testItemDiv);
        }

        function updateSummary(testItemDiv) {
            const passCount = testItemDiv.dataset.passCount;
            const failCount = testItemDiv.dataset.failCount;
            const summaryDiv = testItemDiv.querySelector('.summary');
            summaryDiv.innerHTML = `<span class="pass-label">PASS: ${passCount}</span> <span class="fail-label">FAIL: ${failCount}</span>`;
        }
    </script>
</body>
</html>
