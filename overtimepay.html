<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>當月加班費自動計算機</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4a5568;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="number"]:focus {
            border-color: #3182ce;
            outline: none;
        }
        .result-box {
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px;
            margin-top: 25px;
            border-radius: 4px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .result-item.total {
            border-top: 1px solid #bee3f8;
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
            color: #2b6cb0;
        }
        .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>當月加班費計算機</h2>
    
    <div class="form-group">
        <label for="baseSalary">月底薪 (元)</label>
        <input type="number" id="baseSalary" placeholder="請輸入底薪" value="30000" oninput="calculateOvertime()">
        <div class="hint">※ 依勞基法以每月 30 天、每天 8 小時（共 240 小時）推算時薪。</div>
    </div>

    <div class="form-group">
        <label for="hours134">1.34 倍加班時數 (小時)</label>
        <input type="number" id="hours134" placeholder="請輸入時數" value="0" step="0.5" oninput="calculateOvertime()">
    </div>

    <div class="form-group">
        <label for="hours167">1.67 倍加班時數 (小時)</label>
        <input type="number" id="hours167" placeholder="請輸入時數" value="0" step="0.5" oninput="calculateOvertime()">
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>平日每小時推算時薪:</span>
            <span>$<span id="hourlyWage">0</span> 元</span>
        </div>
        <div class="result-item">
            <span>1.34 倍加班費小計:</span>
            <span>$<span id="subtotal134">0</span> 元</span>
        </div>
        <div class="result-item">
            <span>1.67 倍加班費小計:</span>
            <span>$<span id="subtotal167">0</span> 元</span>
        </div>
        <div class="result-item total">
            <span>當月加班費總計:</span>
            <span>$<span id="totalOvertime">0</span> 元</span>
        </div>
    </div>
</div>

<script>
function calculateOvertime() {
    // 取得輸入值
    const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
    const hours134 = parseFloat(document.getElementById('hours134').value) || 0;
    const hours167 = parseFloat(document.getElementById('hours167').value) || 0;

    // 計算每小時時薪 (勞基法基準：月薪 / 240)
    const hourlyWage = baseSalary / 240;

    // 計算各別加班費 (計算過程中先不四捨五入，保持精準)
    const subtotal134 = hourlyWage * 1.34 * hours134;
    const subtotal167 = hourlyWage * 1.67 * hours167;
    const total = subtotal134 + subtotal167;

    // 渲染到網頁畫面上（顯示時四捨五入至整數位）
    document.getElementById('hourlyWage').innerText = (Math.round(hourlyWage * 100) / 100).toFixed(2); // 時薪保留兩位小數方便檢視
    document.getElementById('subtotal134').innerText = Math.round(subtotal134).toLocaleString();
    document.getElementById('subtotal167').innerText = Math.round(subtotal167).toLocaleString();
    document.getElementById('totalOvertime').innerText = Math.round(total).toLocaleString();
}

// 頁面載入時先自動執行一次初期計算
window.onload = calculateOvertime;
</script>

</body>
</html>
