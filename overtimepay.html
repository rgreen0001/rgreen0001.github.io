<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>當月加班費自動計算機 (含記憶儲存功能)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4a5568;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="number"]:focus {
            border-color: #3182ce;
            outline: none;
        }
        .price-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 14px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #475569;
        }
        .price-item strong {
            color: #e28743;
        }
        .result-box {
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px;
            margin-top: 25px;
            border-radius: 4px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .result-item.total {
            border-top: 1px solid #bee3f8;
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
            color: #2b6cb0;
        }
        .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        .storage-status {
            text-align: center;
            font-size: 12px;
            color: #38a169;
            margin-top: 10px;
            font-weight: 5px;
            height: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>當月加班費計算機</h2>
    
    <div class="form-group">
        <label for="baseSalary">月底薪 (元)</label>
        <input type="number" id="baseSalary" placeholder="請輸入底薪" value="30000" oninput="calculateAndSave()">
        <div class="hint">※ 依勞基法以每月 240 小時推算平日時薪。</div>
    </div>

    <div class="price-box">
        <div class="price-item">
            <span>平日每小時推算時薪:</span>
            <span>$<span id="rateHourly">125.00</span> 元</span>
        </div>
        <div class="price-item">
            <span><strong>1.34 倍</strong> 一小時加班費:</span>
            <span><strong>$<span id="rate134">167.5</span> 元 / 小時</strong></span>
        </div>
        <div class="price-item">
            <span><strong>1.67 倍</strong> 一小時加班費:</span>
            <span><strong>$<span id="rate167">208.8</span> 元 / 小時</strong></span>
        </div>
    </div>

    <div class="form-group">
        <label for="hours134">1.34 倍加班時數 (小時)</label>
        <input type="number" id="hours134" placeholder="請輸入時數" value="0" step="0.5" oninput="calculateAndSave()">
    </div>

    <div class="form-group">
        <label for="hours167">1.67 倍加班時數 (小時)</label>
        <input type="number" id="hours167" placeholder="請輸入時數" value="0" step="0.5" oninput="calculateAndSave()">
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>1.34 倍加班費小計:</span>
            <span>$<span id="subtotal134">0</span> 元</span>
        </div>
        <div class="result-item">
            <span>1.67 倍加班費小計:</span>
            <span>$<span id="subtotal167">0</span> 元</span>
        </div>
        <div class="result-item total">
            <span>當月加班費總計:</span>
            <span>$<span id="totalOvertime">0</span> 元</span>
        </div>
    </div>

    <div id="saveStatus" class="storage-status"></div>
</div>

<script>
// 頁面載入時，先嘗試讀取以前儲存的資料
window.onload = function() {
    if (localStorage.getItem('baseSalary') !== null) {
        document.getElementById('baseSalary').value = localStorage.getItem('baseSalary');
        document.getElementById('hours134').value = localStorage.getItem('hours134');
        document.getElementById('hours167').value = localStorage.getItem('hours167');
    }
    // 執行初期計算
    calculateOvertime();
};

// 核心計算邏輯
function calculateOvertime() {
    const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
    const hours134 = parseFloat(document.getElementById('hours134').value) || 0;
    const hours167 = parseFloat(document.getElementById('hours167').value) || 0;

    // 1. 計算時薪基準 (月薪 / 240)
    const hourlyWage = baseSalary / 240;

    // 2. 計算「一小時」加班費的單價
    const oneHour134 = hourlyWage * 1.34;
    const oneHour167 = hourlyWage * 1.67;

    // 3. 計算總時數對應的加班費小計
    const subtotal134 = oneHour134 * hours134;
    const subtotal167 = oneHour167 * hours167;
    const total = subtotal134 + subtotal167;

    // 渲染「時薪與單價」到網頁上 (保留兩位小數，方便看清法規細節)
    document.getElementById('rateHourly').innerText = hourlyWage.toFixed(2);
    document.getElementById('rate134').innerText = oneHour134.toFixed(2);
    document.getElementById('rate167').innerText = oneHour167.toFixed(2);

    // 渲染「當月總計」到網頁上 (實際發薪四捨五入至整數，並加上千分位)
    document.getElementById('subtotal134').innerText = Math.round(subtotal134).toLocaleString();
    document.getElementById('subtotal167').innerText = Math.round(subtotal167).toLocaleString();
    document.getElementById('totalOvertime').innerText = Math.round(total).toLocaleString();
}

// 計算並自動儲存
let saveTimeout;
function calculateAndSave() {
    // 先行計算
    calculateOvertime();

    // 取得當前數值
    const baseSalary = document.getElementById('baseSalary').value;
    const hours134 = document.getElementById('hours134').value;
    const hours167 = document.getElementById('hours167').value;

    // 儲存至 LocalStorage
    localStorage.setItem('baseSalary', baseSalary);
    localStorage.setItem('hours134', hours134);
    localStorage.setItem('hours167', hours167);

    // 秀出「已自動儲存」的動態提示 (防抖處理，避免頻繁閃爍)
    const statusDiv = document.getElementById('saveStatus');
    statusDiv.innerText = "数据已自動儲存 💾";
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        statusDiv.innerText = "";
    }, 1500);
}
</script>

</body>
</html>
