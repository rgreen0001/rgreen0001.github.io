<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>測試計算機 (四排顯示)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 95%;
            max-width: 1400px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
        }

        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"] {
            width: 200px;
        }

        input[type="number"] {
            width: 90px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 15px;
            font-size: 0.9em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 2px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #a71d2a;
        }

        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #1e7e34;
        }

        #test-items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .test-item {
            width: calc(25% - 10px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 5px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .test-item > span:first-child {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .timer-display {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
            font-family: monospace;
        }

        .button-group {
            margin: 5px 0;
            display: flex;
            flex-wrap: wrap;
        }

        .result {
            font-weight: bold;
            margin-top: 5px;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
        }

        .test-count {
            margin-top: 5px;
            font-size: 0.9em;
            color: #777;
        }

        .summary {
            margin-top: 8px;
            padding: 6px;
            border-radius: 5px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .summary .pass-label {
            color: #155724;
            background-color: #d4edda;
            padding: 3px 6px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .summary .fail-label {
            color: #721c24;
            background-color: #f8d7da;
            padding: 3px 6px;
            border-radius: 5px;
        }

        .producer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>測試計算機</h1>

        <div class="input-group">
            <label for="new-test-item">新增測試項目:</label>
            <input type="text" id="new-test-item" placeholder="請輸入項目名稱">
            <label for="test-duration">倒數秒數:</label>
            <input type="number" id="test-duration" value="10" min="1">
            <button onclick="addTestItem()">新增</button>
        </div>

        <div id="test-items-container">
            <!-- 測試項目將會新增在此 -->
        </div>

        <div class="producer">
            <p>Producer: Ren Liao</p>
        </div>
    </div>

    <script>
        const testItemsContainer = document.getElementById('test-items-container');
        const newTestItemInput = document.getElementById('new-test-item');
        const testDurationInput = document.getElementById('test-duration');
        
        const activeTimers = {};
        let itemCounter = 0;
        let audioCtx = null;

        // 確保點擊網頁任何按鈕或互動時初始化音效權限（解決瀏覽器擋音效問題）
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            try {
                initAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4); 
            } catch (e) {
                console.log("音效播放失敗", e);
            }
        }

        function addTestItem() {
            initAudio();
            const testItemName = newTestItemInput.value.trim();
            let duration = parseInt(testDurationInput.value, 10);

            if (testItemName === "") {
                alert("請輸入測試項目名稱");
                return;
            }

            if (isNaN(duration) || duration <= 0) {
                alert("請輸入有效的倒數秒數");
                return;
            }

            itemCounter++;
            const currentId = itemCounter;

            const testItemDiv = document.createElement('div');
            testItemDiv.classList.add('test-item');
            testItemDiv.dataset.itemId = currentId;
            testItemDiv.dataset.originalTime = duration; 
            testItemDiv.dataset.timeLeft = duration; 
            testItemDiv.dataset.passCount = 0; 
            testItemDiv.dataset.failCount = 0; 
            testItemDiv.dataset.lastResult = ""; // 記錄上一次的結果 ('Pass' 或 'Fail')

            const initialDisplay = formatTime(duration);

            testItemDiv.innerHTML = `
                <span>${testItemName}</span>
                <div class="timer-display">${initialDisplay}</div>
                <div class="button-group">
                    <button onclick="startTimer(${currentId}, this.parentNode.parentNode)">開始</button>
                    <button onclick="stopTimer(${currentId}, this.parentNode.parentNode)" class="btn-danger">停止</button>
                    <button onclick="resetTimer(${currentId}, this.parentNode.parentNode)" class="btn-danger" style="background-color: #6c757d;">重設</button>
                </div>
                <div class="button-group">
                    <button onclick="logTestResult(this.parentNode.parentNode, 'Pass')" class="btn-success">PASS</button>
                    <button onclick="logTestResult(this.parentNode.parentNode, 'Fail')" class="btn-danger">FAIL</button>
                </div>
                <span class="test-count">測試次數: 0</span>
                <div class="summary">
                    <span class="pass-label">PASS: 0</span>
                    <span class="fail-label">FAIL: 0</span>
                </div>
            `;
            testItemsContainer.appendChild(testItemDiv);
            newTestItemInput.value = ""; 
        }

        function startTimer(id, testItemDiv) {
            initAudio();
            if (activeTimers[id]) return; 

            let timeLeft = parseInt(testItemDiv.dataset.timeLeft, 10);
            if (timeLeft <= 0) return;

            activeTimers[id] = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    testItemDiv.dataset.timeLeft = timeLeft;
                    updateTimerDisplay(testItemDiv.querySelector('.timer-display'), timeLeft);
                }

                if (timeLeft <= 0) {
                    clearInterval(activeTimers[id]);
                    activeTimers[id] = null;
                    playBeep(); // 時間到播放聲音
                }
            }, 1000);
        }

        function stopTimer(id, testItemDiv) {
            if (activeTimers[id]) {
                clearInterval(activeTimers[id]);
                activeTimers[id] = null;
            }
        }

        function resetTimer(id, testItemDiv) {
            stopTimer(id, testItemDiv);
            const originalTime = parseInt(testItemDiv.dataset.originalTime, 10);
            testItemDiv.dataset.timeLeft = originalTime;
            updateTimerDisplay(testItemDiv.querySelector('.timer-display'), originalTime);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function updateTimerDisplay(timerDisplay, seconds) {
            timerDisplay.textContent = formatTime(seconds);
        }

        function logTestResult(testItemDiv, result) {
            initAudio();
            let passCount = parseInt(testItemDiv.dataset.passCount, 10) || 0;
            let failCount = parseInt(testItemDiv.dataset.failCount, 10) || 0;
            let lastResult = testItemDiv.dataset.lastResult;

            // 如果之前有按過結果，且點了不同的按鈕（代表按錯要修正），則把上一次的次數扣掉
            if (lastResult === 'Pass') {
                passCount = Math.max(0, passCount - 1);
            } else if (lastResult === 'Fail') {
                failCount = Math.max(0, failCount - 1);
            }

            // 加上新的結果
            if (result === 'Pass') {
                passCount++;
                testItemDiv.dataset.lastResult = 'Pass';
            } else {
                failCount++;
                testItemDiv.dataset.lastResult = 'Fail';
            }

            testItemDiv.dataset.passCount = passCount;
            testItemDiv.dataset.failCount = failCount;

            // 總測試次數就是 PASS + FAIL 的總和
            let totalTestCount = passCount + failCount;
            testItemDiv.dataset.testCount = totalTestCount;
            testItemDiv.querySelector('.test-count').textContent = `測試次數: ${totalTestCount}`;

            // 更新畫面上的 PASS/FAIL 結果標籤
            const existingResult = testItemDiv.querySelector('.result');
            if (existingResult) {
                existingResult.remove();
            }
            const resultSpan = document.createElement('span');
            resultSpan.classList.add('result', result.toLowerCase());
            resultSpan.textContent = result;
            testItemDiv.appendChild(resultSpan);

            updateSummary(testItemDiv);
        }

        function updateSummary(testItemDiv) {
            const passCount = testItemDiv.dataset.passCount;
            const failCount = testItemDiv.dataset.failCount;
            const summaryDiv = testItemDiv.querySelector('.summary');
            summaryDiv.innerHTML = `<span class="pass-label">PASS: ${passCount}</span> <span class="fail-label">FAIL: ${failCount}</span>`;
        }
    </script>
</body>
</html>
