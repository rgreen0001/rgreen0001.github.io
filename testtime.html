<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>測試計算機 (四排顯示)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 95%;
            max-width: 1400px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
        }

        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"] {
            width: 200px;
        }

        input[type="number"] {
            width: 90px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 0.85em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 2px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #a71d2a;
        }

        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #1e7e34;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }

        #test-items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .test-item {
            width: calc(25% - 10px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 5px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .test-item > span:first-child {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .timer-display {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
            font-family: monospace;
        }

        .button-group {
            margin: 5px 0;
            display: flex;
            flex-wrap: wrap;
        }

        .result {
            font-weight: bold;
            margin-top: 5px;
            font-size: 1.1em;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
        }

        .test-count {
            margin-top: 5px;
            font-size: 0.9em;
            color: #777;
        }

        .summary {
            margin-top: 8px;
            padding: 6px;
            border-radius: 5px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .summary .pass-label {
            color: #155724;
            background-color: #d4edda;
            padding: 3px 6px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .summary .fail-label {
            color: #721c24;
            background-color: #f8d7da;
            padding: 3px 6px;
            border-radius: 5px;
        }

        .producer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>測試計算機</h1>

        <div class="input-group">
            <label for="new-test-item">新增測試項目:</label>
            <input type="text" id="new-test-item" placeholder="請輸入項目名稱">
            <label for="test-duration">倒數秒數:</label>
            <input type="number" id="test-duration" value="10" min="1">
            <button onclick="addTestItem()">新增</button>
        </div>

        <div id="test-items-container">
            <!-- 測試項目將會新增在此 -->
        </div>

        <div class="producer">
            <p>Producer: Ren Liao</p>
        </div>
    </div>

    <script>
        const testItemsContainer = document.getElementById('test-items-container');
        const newTestItemInput = document.getElementById('new-test-item');
        const testDurationInput = document.getElementById('test-duration');
        
        const activeTimers = {};
        const itemHistories = {}; // 追蹤每個項目的操作紀錄，用於正確累積與撤銷
        let itemCounter = 0;
        let audioCtx = null;

        // 解鎖音效
        function unlockAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('click', unlockAudio, { once: true });

        // 播放音效
        function playBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("音效播放失敗", e);
            }
        }

        function addTestItem() {
            unlockAudio();
            const testItemName = newTestItemInput.value.trim();
            let duration = parseInt(testDurationInput.value, 10);

            if (testItemName === "") {
                alert("請輸入測試項目名稱");
                return;
            }

            if (isNaN(duration) || duration <= 0) {
                alert("請輸入有效的倒數秒數");
                return;
            }

            itemCounter++;
            const currentId = itemCounter;
            itemHistories[currentId] = []; // 初始化歷史紀錄陣列

            const testItemDiv = document.createElement('div');
            testItemDiv.classList.add('test-item');
            testItemDiv.dataset.itemId = currentId;
            testItemDiv.dataset.originalTime = duration; 
            testItemDiv.dataset.timeLeft = duration; 
            testItemDiv.dataset.passCount = 0; 
            testItemDiv.dataset.failCount = 0; 

            const initialDisplay = formatTime(duration);

            testItemDiv.innerHTML = `
                <span>${testItemName}</span>
                <div class="timer-display">${initialDisplay}</div>
                <div class="button-group">
                    <button onclick="startTimer(${currentId}, this.parentNode.parentNode)">開始</button>
                    <button onclick="stopTimer(${currentId}, this.parentNode.parentNode)" class="btn-danger">停止</button>
                    <button onclick="resetTimer(${currentId}, this.parentNode.parentNode)" class="btn-danger" style="background-color: #6c757d;">重設</button>
                </div>
                <div class="button-group">
                    <button onclick="logResult(${currentId}, this.parentNode.parentNode, 'Pass')" class="btn-success">PASS</button>
                    <button onclick="logResult(${currentId}, this.parentNode.parentNode, 'Fail')" class="btn-danger">FAIL</button>
                    <button onclick="undoResult(${currentId}, this.parentNode.parentNode)" class="btn-warning" title="按錯可點此撤銷上一步">撤銷</button>
                </div>
                <span class="test-count">測試次數: 0</span>
                <div class="summary">
                    <span class="pass-label">PASS: 0</span>
                    <span class="fail-label">FAIL: 0</span>
                </div>
            `;
            testItemsContainer.appendChild(testItemDiv);
            newTestItemInput.value = ""; 
        }

        function startTimer(id, testItemDiv) {
            unlockAudio();
            if (activeTimers[id]) return; 

            let timeLeft = parseInt(testItemDiv.dataset.timeLeft, 10);
            if (timeLeft <= 0) return;

            activeTimers[id] = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    testItemDiv.dataset.timeLeft = timeLeft;
                    updateTimerDisplay(testItemDiv.querySelector('.timer-display'), timeLeft);
                }

                if (timeLeft <= 0) {
                    clearInterval(activeTimers[id]);
                    activeTimers[id] = null;
                    playBeep(); // 播放音效
                }
            }, 1000);
        }

        function stopTimer(id, testItemDiv) {
            if (activeTimers[id]) {
                clearInterval(activeTimers[id]);
                activeTimers[id] = null;
            }
        }

        function resetTimer(id, testItemDiv) {
            stopTimer(id, testItemDiv);
            const originalTime = parseInt(testItemDiv.dataset.originalTime, 10);
            testItemDiv.dataset.timeLeft = originalTime;
            updateTimerDisplay(testItemDiv.querySelector('.timer-display'), originalTime);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function updateTimerDisplay(timerDisplay, seconds) {
            timerDisplay.textContent = formatTime(seconds);
        }

        // 記錄 PASS 或 FAIL（支援正常累加）
        function logResult(id, testItemDiv, result) {
            unlockAudio();
            let passCount = parseInt(testItemDiv.dataset.passCount, 10) || 0;
            let failCount = parseInt(testItemDiv.dataset.failCount, 10) || 0;

            // 將這次的操作推入歷史紀錄
            itemHistories[id].push(result);

            if (result === 'Pass') {
                passCount++;
            } else {
                failCount++;
            }

            testItemDiv.dataset.passCount = passCount;
            testItemDiv.dataset.failCount = failCount;

            updateDisplay(testItemDiv, result, passCount, failCount);
        }

        // 撤銷上一步（用來修改按錯的情況）
        function undoResult(id, testItemDiv) {
            let history = itemHistories[id];
            if (!history || history.length === 0) {
                alert("目前沒有任何紀錄可以撤銷！");
                return;
            }

            let lastAction = history.pop(); // 取出最後一次動作
            let passCount = parseInt(testItemDiv.dataset.passCount, 10) || 0;
            let failCount = parseInt(testItemDiv.dataset.failCount, 10) || 0;

            if (lastAction === 'Pass') {
                passCount = Math.max(0, passCount - 1);
            } else if (lastAction === 'Fail') {
                failCount = Math.max(0, failCount - 1);
            }

            testItemDiv.dataset.passCount = passCount;
            testItemDiv.dataset.failCount = failCount;

            // 取得目前的最新狀態顯示
            let latestResult = history.length > 0 ? history[history.length - 1] : null;
            updateDisplay(testItemDiv, latestResult, passCount, failCount);
        }

        function updateDisplay(testItemDiv, currentResult, passCount, failCount) {
            let totalCount = passCount + failCount;
            testItemDiv.dataset.testCount = totalCount;
            testItemDiv.querySelector('.test-count').textContent = `測試次數: ${totalCount}`;

            // 更新最新結果標籤
            let resultSpan = testItemDiv.querySelector('.result');
            if (currentResult) {
                if (!resultSpan) {
                    resultSpan = document.createElement('span');
                    resultSpan.classList.add('result');
                    testItemDiv.appendChild(resultSpan);
                }
                resultSpan.className = `result ${currentResult.toLowerCase()}`;
                resultSpan.textContent = currentResult;
            } else {
                if (resultSpan) {
                    resultSpan.remove();
                }
            }

            // 更新下方統計
            const summaryDiv = testItemDiv.querySelector('.summary');
            summaryDiv.innerHTML = `<span class="pass-label">PASS: ${passCount}</span> <span class="fail-label">FAIL: ${failCount}</span>`;
        }
    </script>
</body>
</html>
