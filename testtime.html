<!DOCTYPE html>
<html>
<head>
    <title>測試計算機 (四排顯示)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 95%; /* 調整容器寬度 */
            max-width: 1400px; /* 設定最大寬度 */
            position: relative; /* 為了絕對定位計時器 */
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        label {
            display: inline-block;
            margin-right: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 200px; /* 調整輸入框寬度 */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #test-items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .test-item {
            width: calc(25% - 10px); /* 每列顯示四個項目，並減去間距 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 5px;
            box-sizing: border-box;
        }

        .result {
            font-weight: bold;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
        }

        .test-count {
            margin-left: 10px;
            font-size: 0.9em;
            color: #777;
        }

        .summary {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            text-align: left;
        }

        .summary .pass-label {
            color: #155724;
            background-color: #d4edda;
            padding: 3px 6px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .summary .fail-label {
            color: #721c24;
            background-color: #f8d7da;
            padding: 3px 6px;
            border-radius: 5px;
            margin-left: 5px;
        }

        /* 新增的 Producer 樣式 */
        .producer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }

        /* 新增的計時器樣式 */
        #timer-container {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
        }

        #timer {
            font-size: 1.2em;
            color: #333;
            margin-right: 10px;
        }

        #timer-input-container {
            display: flex;
            margin-right: 10px;
        }

        #timer-input-container input {
            width: 40px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="timer-container">
            <div id="timer">00:00:00</div>
            <div id="timer-input-container">
                <input type="number" id="hours-input" placeholder="時" value="0">
                <input type="number" id="minutes-input" placeholder="分" value="0">
                <input type="number" id="seconds-input" placeholder="秒" value="0">
            </div>
            <button onclick="startTimer()">開始</button>
            <button onclick="stopTimer()">停止</button>
            <button onclick="resetTimer()">重置</button>
            <button onclick="stopSound()">停止音效</button> <!-- 新增停止音效按鈕 -->
        </div>
        <h1>測試計算機</h1>

        <div class="input-group">
            <label for="new-test-item">新增測試項目:</label>
            <input type="text" id="new-test-item" placeholder="請輸入測試項目名稱">
            <button onclick="addTestItem()">新增</button>
        </div>

        <div id="test-items-container">
            <!-- 測試項目將會新增在此 -->
        </div>

        <!-- 新增的 Producer 資訊 -->
        <div class="producer">
            <p>Producer: Ren Liao</p>
        </div>

        <!-- 音訊元素 -->
        <audio id="alarm-sound" src="alarm.mp3" preload="auto"></audio>
    </div>

    <script>
        const testItemsContainer = document.getElementById('test-items-container');
        const newTestItemInput = document.getElementById('new-test-item');
        const timerDisplay = document.getElementById('timer');
        const hoursInput = document.getElementById('hours-input');
        const minutesInput = document.getElementById('minutes-input');
        const secondsInput = document.getElementById('seconds-input');
        const alarmSound = document.getElementById('alarm-sound');

        let startTime = null;
        let timerInterval;
        let timeLeft;
        let soundPlaying = false; // 追蹤音效是否正在播放

        function startTimer() {
            const hours = parseInt(hoursInput.value) || 0;
            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;

            timeLeft = hours * 3600 + minutes * 60 + seconds;

            if (timeLeft <= 0) {
                alert("請輸入有效的時間");
                return;
            }

            startTime = new Date().getTime();
            updateTimer(); // 立即更新一次
            timerInterval = setInterval(updateTimer, 1000);

            // 停用輸入框，避免在計時期間修改
            hoursInput.disabled = true;
            minutesInput.disabled = true;
            secondsInput.disabled = true;
        }

        function stopTimer() {
            clearInterval(timerInterval);
            // 啟用輸入框
            hoursInput.disabled = false;
            minutesInput.disabled = false;
            secondsInput.disabled = false;
        }

        function resetTimer() {
            stopTimer();
            timeLeft = 0;
            updateTimerDisplay();

            // 啟用輸入框並清除值
            hoursInput.disabled = false;
            minutesInput.disabled = false;
            secondsInput.disabled = false;
            hoursInput.value = 0;
            minutesInput.value = 0;
            secondsInput.value = 0;
            stopSound(); // 重置計時器時停止音效
        }

        function updateTimer() {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.textContent = "時間到！";
                // 啟用輸入框
                hoursInput.disabled = false;
                minutesInput.disabled = false;
                secondsInput.disabled = false;

                // 播放音效
                playSound();

                return;
            }

            updateTimerDisplay();
            timeLeft--;
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            const seconds = timeLeft % 60;

            const formattedTime = pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
            timerDisplay.textContent = formattedTime;
        }

        function pad(number) {
            return (number < 10) ? "0" + number : number;
        }

        function playSound() {
            alarmSound.currentTime = 0; // 重置播放時間
            alarmSound.play();
            soundPlaying = true; // 設定音效正在播放的標記
        }

        function stopSound() {
            alarmSound.pause(); // 停止播放
            alarmSound.currentTime = 0; // 重置播放時間
            soundPlaying = false; // 設定音效已停止播放的標記
        }

        function addTestItem() {
            const testItemName = newTestItemInput.value.trim();
            if (testItemName === "") {
                alert("請輸入測試項目名稱");
                return;
            }

            const testItemDiv = document.createElement('div');
            testItemDiv.classList.add('test-item');
            testItemDiv.dataset.testCount = 0; // 初始化測試次數
            testItemDiv.dataset.passCount = 0; // 初始化通過次數
            testItemDiv.dataset.failCount = 0; // 初始化失敗次數

            testItemDiv.innerHTML = `
                <span>${testItemName}</span>
                <div>
                    <button onclick="logTestResult(this.parentNode.parentNode, 'Pass')">PASS</button>
                    <button onclick="logTestResult(this.parentNode.parentNode, 'Fail')">FAIL</button>
                </div>
                <span class="test-count">測試次數: 0</span>
                <div class="summary">
                    <span class="pass-label">PASS: 0</span>
                    <span class="fail-label">FAIL: 0</span>
                </div>
            `;
            testItemsContainer.appendChild(testItemDiv);
            newTestItemInput.value = ""; // 清空輸入框
        }

        function logTestResult(testItemDiv, result) {
            const resultSpan = document.createElement('span');
            resultSpan.classList.add('result', result.toLowerCase());
            resultSpan.textContent = result;

            // 檢查是否有舊的結果並移除
            const existingResult = testItemDiv.querySelector('.result');
            if (existingResult) {
                existingResult.remove();
            }

            // 新增結果
            testItemDiv.appendChild(resultSpan);

            // 更新測試次數
            let testCount = parseInt(testItemDiv.dataset.testCount) + 1;
            testItemDiv.dataset.testCount = testCount;
            testItemDiv.querySelector('.test-count').textContent = `測試次數: ${testCount}`;

            // 更新個別總計
            let passCount = parseInt(testItemDiv.dataset.passCount);
            let failCount = parseInt(testItemDiv.dataset.failCount);

            if (result === 'Pass') {
                passCount++;
                testItemDiv.dataset.passCount = passCount;
            } else {
                failCount++;
                testItemDiv.dataset.failCount = failCount;
            }

            updateSummary(testItemDiv);
        }

        function updateSummary(testItemDiv) {
            const passCount = testItemDiv.dataset.passCount;
            const failCount = testItemDiv.dataset.failCount;
            const summaryDiv = testItemDiv.querySelector('.summary');
            summaryDiv.innerHTML = `<span class="pass-label">PASS: ${passCount}</span> <span class="fail-label">FAIL: ${failCount}</span>`;
        }
    </script>
</body>
</html>
